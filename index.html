<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SMART-WATER-SITE</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 20% 20%, rgba(0, 255, 140, 0.10), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(0, 90, 255, 0.14), transparent 35%),
                #020b16;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        /* Background Grid */
        .grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 255, 140, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 140, 0.035) 1px, transparent 1px);
            background-size: 45px 45px;
            animation: gridMove 18s linear infinite;
        }

        @keyframes gridMove {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(45px);
            }
        }

        /* Glow */
        .glow {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(0, 255, 140, 0.10);
            filter: blur(80px);
            top: 20%;
            left: 10%;
            animation: glowMove 7s ease-in-out infinite alternate;
        }

        @keyframes glowMove {
            from {
                transform: translate(0, 0);
            }
            to {
                transform: translate(250px, 100px);
            }
        }

        /* Main */
        .container {
            position: relative;
            z-index: 5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
        }

        .content {
            max-width: 900px;
        }

        .system-label {
            color: #27f59a;
            font-size: 13px;
            letter-spacing: 5px;
            margin-bottom: 25px;
            opacity: 0;
            animation: fadeIn 1s ease forwards;
        }

        .title {
            font-size: clamp(42px, 8vw, 90px);
            font-weight: 800;
            letter-spacing: 4px;
            line-height: 1.05;
            background: linear-gradient(
                90deg,
                #ffffff,
                #27f59a,
                #ffffff
            );
            background-size: 200% auto;
         -webkit-background-clip: text;
          background-clip: text;
            -webkit-text-fill-color: transparent;
            animation:
                titleIn 1.5s ease forwards,
                shine 5s linear infinite;
        }

        @keyframes titleIn {
            from {
                opacity: 0;
                transform: translateY(35px);
                letter-spacing: 15px;
            }
            to {
                opacity: 1;
                transform: translateY(0);
                letter-spacing: 4px;
            }
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        .subtitle {
            margin-top: 25px;
            color: #9bb0bd;
            font-size: 16px;
            letter-spacing: 1px;
            line-height: 1.7;
            opacity: 0;
            animation: fadeIn 1s ease 1s forwards;
        }

        .start-btn {
            margin-top: 45px;
            padding: 16px 55px;
            border: 1px solid rgba(39, 245, 154, 0.65);
            border-radius: 10px;
            background: rgba(39, 245, 154, 0.08);
            color: #27f59a;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.35s ease;
            box-shadow:
                0 0 25px rgba(39, 245, 154, 0.08),
                inset 0 0 20px rgba(39, 245, 154, 0.03);
            opacity: 0;
            animation: fadeIn 1s ease 1.5s forwards;
        }

        .start-btn:hover {
            background: #27f59a;
            color: #02100b;
            transform: translateY(-3px);
            box-shadow: 0 0 35px rgba(39, 245, 154, 0.35);
        }

        .bottom-text {
            position: fixed;
            bottom: 25px;
            left: 0;
            right: 0;
            text-align: center;
            color: #526774;
            font-size: 11px;
            letter-spacing: 2px;
            z-index: 10;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* Mobile */
        @media (max-width: 600px) {

            .title {
                font-size: 43px;
                letter-spacing: 2px;
            }

            .subtitle {
                font-size: 14px;
            }

            .start-btn {
                padding: 15px 45px;
            }

            .system-label {
                font-size: 10px;
                letter-spacing: 3px;
            }
        }
    </style>
</head>

<body>

    <div class="grid"></div>
    <div class="glow"></div>

    <main class="container">

        <div class="content">

            <div class="system-label">
                INDUSTRIAL WATER INTELLIGENCE
            </div>

            <h1 class="title">
                SMART-WATER-SITE
            </h1>

            <p class="subtitle">
                Intelligent water monitoring and automated management
                <br>
                designed for scalable real-world systems.
            </p>

            <button class="start-btn" onclick="startSystem()">
                START
            </button>

        </div>

    </main>

    <div class="bottom-text">
        SMART WATER MANAGEMENT SYSTEM
    </div>

    <script>
        function startSystem() {

            // Navigate to Login page
            window.location.href = "login.html";

        }
    </script>

</body>
</html>
